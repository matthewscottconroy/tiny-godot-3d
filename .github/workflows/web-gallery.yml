name: web gallery

# Exports the demos to the web and publishes a playable gallery to GitHub Pages.
#
# Validated end to end against Godot 4.7: 58 demos exported, 1 skipped
# (multiplayer-3d, whose ENet transport a browser cannot open), 0 failed.
#
# The whole gallery is about 42MB, of which 38MB is one shared copy of the
# engine and roughly 4MB is the 58 demos put together. That sharing is not a
# nicety: Godot emits a complete 37.7MB runtime beside every export, identical
# every time, so the naive layout is 2.2GB against a GitHub Pages limit of 1GB
# and cannot deploy at all. tools/export_web.sh lifts it into _engine/ and
# repoints each demo's loader. The size guard below is there so that if the
# sharing ever breaks, it fails here rather than at the Pages upload.
#
# Still manual-dispatch only, so it cannot break the normal CI.
#
# Before enabling: Settings → Pages → Source → GitHub Actions.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Deploy to GitHub Pages (otherwise just build and upload an artifact)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.7.1"
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot and the web export templates
        run: |
          mkdir -p ~/godot
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -o /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot

          # Templates install to a version-named directory Godot looks in.
          curl -fsSL "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o /tmp/templates.tpz
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q -o /tmp/templates.tpz -d /tmp/templates
          mv /tmp/templates/templates "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

      - name: Export demos to the web
        run: |
          export PATH="$HOME/godot:$PATH"
          ./tools/export_web.sh

      - name: Build the landing page
        run: ./tools/build_web_index.py

      - name: Check the engine is still shared
        # One copy of the runtime, not fifty-eight. Measured at ~42MB; 200MB
        # leaves room for the gallery to grow while still failing long before
        # the 1GB Pages limit, and failing here says why rather than leaving a
        # rejected upload to be interpreted.
        run: |
          size_mb=$(du -sm build/web | cut -f1)
          engines=$(find build/web -name 'index.wasm' | wc -l)
          echo "gallery is ${size_mb}MB across $(ls -d build/web/*/ | wc -l) directories, ${engines} engine copies"
          if [ "$engines" -ne 1 ]; then
            echo "::error::expected exactly one shared index.wasm, found ${engines} —" \
                 "the runtime is being duplicated per demo and the site will not fit on Pages"
            exit 1
          fi
          if [ "$size_mb" -gt 200 ]; then
            echo "::error::gallery is ${size_mb}MB, over the 200MB guard"
            exit 1
          fi

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: web-gallery
          path: build/web

      - name: Package for Pages
        if: inputs.publish
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    if: inputs.publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
